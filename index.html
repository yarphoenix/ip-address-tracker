<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

    <title>IP Address Tracker</title>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="./src/style.css">
</head>
<body>
	<header class="finder">
		<h1 class="title">IP Address Tracker</h1>
		<div class="search-bar">
			<input class="search-bar__input" type="text" placeholder="Search for any IPv4 address">
			<button class="search-bar__btn" type="button"></button>
		</div>

		<div class="info">
			<div class="info__block">
				<div class="info__block-subtitle">IP Address</div>
				<div class="info__block-title" id="ip"></div>
			</div>
			<div class="info__block">
				<div class="info__block-subtitle">Location</div>
				<div class="info__block-title" id="location"></div>
			</div>
			<div class="info__block">
				<div class="info__block-subtitle">Timezone</div>
				<div class="info__block-title">UTC <span id="timezone"></span></div>
			</div>
			<div class="info__block">
				<div class="info__block-subtitle">ISP</div>
				<div class="info__block-title" id="isp"></div>
			</div>
		</div>
	</header>
	<div class="map" id="map">
		<div class="preloader" id="preloader" role="status" aria-live="polite" aria-label="Loading map">
			<div class="preloader__spinner"></div>
			<div class="preloader__text">Loading…</div>
		</div>
	</div>

	<button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode" aria-pressed="false">
		<span class="theme-toggle__label theme-toggle__label--day">DAYMODE</span>
		<span class="theme-toggle__label theme-toggle__label--night">NIGHTMODE</span>
		<span class="theme-toggle__knob">
			<svg class="theme-toggle__icon theme-toggle__icon--sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
				<circle cx="12" cy="12" r="4"></circle>
				<path d="M12 2v2"></path>
				<path d="M12 20v2"></path>
				<path d="m4.93 4.93 1.41 1.41"></path>
				<path d="m17.66 17.66 1.41 1.41"></path>
				<path d="M2 12h2"></path>
				<path d="M20 12h2"></path>
				<path d="m6.34 17.66-1.41 1.41"></path>
				<path d="m19.07 4.93-1.41 1.41"></path>
			</svg>
			<svg class="theme-toggle__icon theme-toggle__icon--moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
				<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
				<circle cx="17" cy="6" r="0.6" fill="currentColor"></circle>
				<circle cx="19.5" cy="9" r="0.4" fill="currentColor"></circle>
				<circle cx="15.5" cy="3.5" r="0.4" fill="currentColor"></circle>
			</svg>
		</span>
	</button>
<script type="module" src="./src/index.js"></script>
</body>
</html>
